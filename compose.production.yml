name: llm-compare

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-compare:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:3101:3001"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 640m
    cpus: 0.8
